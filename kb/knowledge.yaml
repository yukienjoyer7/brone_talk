    variasi: [UKT UB berapa, berapa biaya kuliah di Brawijaya, uang kuliah UB berapa, biaya kuliah UB mahal tidak]
    a: >-
      Untuk jalur SNBP dan SNBT, UKT kelompok 1 sebesar 500 ribu rupiah dan kelompok 2 sebesar 1 juta rupiah per semester,
      sedangkan kelompok lebih tinggi berbeda tiap prodi. Jalur mandiri membayar UKT ditambah IPI sekali bayar.
      Rincian per prodi ada di selma.ub.ac.id.
