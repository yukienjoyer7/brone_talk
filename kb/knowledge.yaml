        teks: >-
          FILKOM Apps dipakai untuk mengelola skripsi, mulai dari proposal, logbook, seminar hasil, hingga ujian.
          Pertanyaan administratif bisa diajukan lewat HaloFILKOM di halofilkom.ub.ac.id. Perkuliahan daring memakai LMS BRONE.
          Instagram resmi FILKOM adalah @filkomub.
        sumber: [filkom_fasilitas]
      - sub: Aksesibilitas FILKOM
        teks: >-
          Gedung-gedung FILKOM dilengkapi ramp, lift yang ramah tunanetra, toilet khusus disabilitas di setiap gedung,
          dan parkir khusus penyandang disabilitas di basemen Gedung F dan G.
