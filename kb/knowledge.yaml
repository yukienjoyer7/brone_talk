# ===========================================================================
# FAQ (BAGIAN 19). Jawaban siap ucap, dijawab langsung tanpa LLM bila cocok.
#   q         : pertanyaan baku
#   variasi   : cara lain orang menanyakan hal yang sama (dipakai untuk pencocokan embedding)
#   a         : jawaban yang diucapkan robot (hanya fakta dari KB ini)
#   entitas   : kode fakultas (mis. F14) bila FAQ khusus satu fakultas, atau "bebas"
#               bila FAQ boleh dijawab walau pertanyaan menyebut nama fakultas.
#               Tanpa entitas: FAQ ditolak bila pertanyaan menyebut fakultas tertentu.
# FAQ dekan, program studi, dan lokasi tiap fakultas dibuat otomatis oleh build_kb.py.
# ===========================================================================
faq:
  # ---------------------------------------------------------------- sapaan dan robot
  - id: sapaan
    q: Halo Bron, apa kabar?
    variasi: [halo, hai Bron, apa kabar, selamat pagi, selamat siang, selamat sore, hai apa kabar kamu]
    a: Halo! Kabar Bron baik. Ada yang ingin kamu ketahui tentang Universitas Brawijaya?
    sumber: [tim_brone]
  - id: terima-kasih
    q: Terima kasih, Bron.
    variasi: [terima kasih, makasih, makasih ya Bron, terima kasih banyak, thank you]
    a: Sama-sama! Senang bisa membantu. Kalau ada pertanyaan lain tentang UB, tanya saja.
    sumber: [tim_brone]
  - id: siapa-kamu
    q: Siapa kamu?
    variasi: [kamu siapa, siapa namamu, perkenalkan dirimu, namamu siapa, kamu itu siapa, siapa nama robot ini, kamu robot apa namanya]
    a: Saya Bron, robot humanoid maskot Universitas Brawijaya. Saya bisa menjawab pertanyaan seputar UB.
    sumber: [ub_brand, tim_brone]
  - id: kemampuan
    q: Kamu bisa apa saja?
    variasi: [apa saja kemampuanmu, kamu bisa ngapain, apa yang bisa kamu lakukan, kamu bisa berjalan tidak, kamu bisa bergerak tidak, kamu bisa melambai tidak]
    a: >-
      Saya bisa mendengar pertanyaan dan menjawab informasi seputar Universitas Brawijaya, menampilkan ekspresi wajah,
      dan menatap lawan bicara. Saya belum bisa bergerak seperti melambai atau berjalan.
    sumber: [tim_brone]
  - id: bentuk-robot
    q: Robot BRONE berbentuk apa?
    variasi: [kamu berbentuk apa, robot BRONE itu seperti apa, apakah kamu robot humanoid, Bron itu robot jenis apa]
    a: Bron berbentuk robot humanoid, yaitu robot yang menyerupai manusia, sebagai wujud maskot BRONE Universitas Brawijaya.
    sumber: [ub_brand, filkom_nirc2025]
  - id: kepanjangan-brone
    q: Apa kepanjangan BRONE?
    variasi: [BRONE singkatan dari apa, arti nama BRONE, BRONE itu artinya apa, kepanjangan Bron]
    a: BRONE adalah singkatan dari Brawijaya Number One, maskot resmi Universitas Brawijaya.
    sumber: [ub_brand]
  - id: makna-maskot
    q: Apa makna maskot BRONE?
    variasi: [filosofi maskot BRONE, kenapa maskot UB berbentuk robot, makna maskot Universitas Brawijaya, maskot UB itu apa]
    a: >-
      BRONE adalah maskot resmi UB berupa robot pendamping yang menjadi pemandu informasi, mampu belajar,
      dan terus berkembang. Bentuk robot melambangkan inovasi serta kekuatan daya saing.
    sumber: [ub_brand]
  - id: warna-maskot
    q: Apa arti warna maskot BRONE?
    variasi: [arti warna BRONE, kenapa BRONE warnanya biru dan kuning, makna warna maskot UB, filosofi warna BRONE]
    a: Warna biru, kuning, silver, dan hitam pada BRONE melambangkan kepercayaan, kebahagiaan, modernisasi, dan elegan.
    sumber: [ub_brand]
  - id: pembuat-robot
    q: Siapa yang membuat kamu?
    variasi: [siapa pembuatmu, kamu dibuat oleh siapa, siapa yang mengembangkan robot BRONE, kamu buatan siapa, tim pembuat robot BRONE dari mana, siapa yang bikin robot ini]
    a: >-
      Bron dikembangkan melalui program UB Globalizing Project Robot BRONE oleh dosen, mahasiswa, dan alumni
      dari Fakultas Ilmu Komputer, Teknik Elektro, dan Teknik Mesin UB.
    sumber: [filkom_pitoyo2026, filkom_workshop2024]
    entitas: bebas
  - id: prestasi-robot
    q: Apa prestasi tim robot BRONE?
    variasi: [prestasi robot BRONE apa saja, tim BRONE pernah juara apa, BRONE pernah ikut lomba apa, pencapaian tim robot BRONE]
    a: >-
      Tim BRONE meraih Juara 3 Best Performance Team pada National Industrial Robotic Competition 2025
      di Universitas Negeri Padang, bersaing dengan 34 tim dari 20 perguruan tinggi.
    sumber: [filkom_nirc2025]
  - id: kerja-sama-jepang
    q: Apa kerja sama tim BRONE dengan Jepang?
    variasi: [workshop robot BRONE dengan Chukyo University, BRONE pernah kerja sama dengan universitas Jepang, siapa Profesor Pitoyo Hartono]
    a: >-
      Pada 30 Agustus 2024 UB dan Chukyo University dari Jepang mengadakan workshop pengembangan teknologi robot
      untuk tim robot BRONE, dengan narasumber Profesor Pitoyo Hartono.
    sumber: [filkom_workshop2024]
  - id: lms-brone
    q: Apa itu LMS BRONE?
    variasi: [BRONE ub ac id itu apa, LMS BRONE untuk apa, platform BRONE itu apa, e-learning BRONE itu apa]
    a: >-
      LMS BRONE adalah Learning Management System atau platform pembelajaran daring di brone.ub.ac.id
      yang dipakai FILKOM dan Fakultas Kedokteran untuk perkuliahan.
    sumber: [filkom_fasilitas]

  # ---------------------------------------------------------------- profil UB
  - id: lokasi-ub
    q: Di mana kampus UB?
    variasi: [UB itu di mana, lokasi Universitas Brawijaya di mana, alamat kampus UB, kampus Brawijaya ada di kota apa, kampus utama UB di mana, UB ada di jalan apa]
    a: >-
      Kampus utama Universitas Brawijaya ada di Jalan Veteran, Kota Malang, Jawa Timur. UB juga punya Kampus Dieng
      di Kabupaten Malang, PSDKU di Kediri, dan kampus baru yang sedang dibangun di Kepanjen.
    sumber: [ub_stat, aset_kepanjen]
  - id: moto
    q: Apa moto UB?
    variasi: [semboyan UB apa, motto Universitas Brawijaya, slogan UB, apa arti Building Up Noble Future]
    a: Moto UB adalah Building Up Noble Future, yang berarti membangun kemuliaan masa depan.
    sumber: [ub_profil, ub_brand]
  - id: luas-kampus
    q: Berapa luas kampus UB?
    variasi: [luas UB berapa hektare, seberapa besar kampus Brawijaya, luas lahan UB, UB luasnya berapa]
    a: >-
      Kampus utama UB di Jalan Veteran luasnya sekitar 51,6 hektare. Secara keseluruhan aset lahan UB sekitar 981 hektare,
      termasuk lahan penelitian dan hutan pendidikan UB Forest.
    sumber: [ub_stat, web_aset981]
  - id: jumlah-fakultas
    q: Berapa jumlah fakultas di UB?
    variasi: [UB punya berapa fakultas, ada berapa fakultas di Brawijaya, jumlah fakultas Universitas Brawijaya, fakultas di UB ada berapa]
    a: UB memiliki 17 fakultas ditambah Sekolah Pascasarjana, dengan 197 program studi.
    sumber: [detik_rename, ub_stat]
  - id: daftar-fakultas
    q: Apa saja fakultas di UB?
    variasi: [sebutkan fakultas di UB, fakultas apa saja yang ada di Brawijaya, daftar fakultas Universitas Brawijaya, UB punya fakultas apa saja]
    a: >-
      Fakultas di UB adalah Hukum, Ekonomi dan Bisnis, Ilmu Administrasi, Bio-Industri Pertanian dan Kehutanan,
      Sains dan Teknologi Peternakan, Perikanan dan Ilmu Kelautan, Kedokteran, Teknik, Sains Teknologi dan Matematika,
      Teknologi Agroindustri dan Biosistem, Ilmu Sosial dan Ilmu Politik, Ilmu Budaya, Kedokteran Gigi, Kedokteran Hewan,
      Ilmu Komputer, Vokasi, dan Ilmu Kesehatan, ditambah Sekolah Pascasarjana.
    sumber: [detik_rename]
  - id: ganti-nama-fakultas
    q: Fakultas apa saja yang ganti nama di UB?
    variasi: [fakultas yang berubah nama di UB, apakah ada fakultas UB yang berubah nama, FMIPA sekarang namanya apa, Fakultas Pertanian sekarang namanya apa, Fakultas Peternakan ganti nama jadi apa, Fakultas Teknologi Pertanian sekarang apa namanya]
    a: >-
      Sejak 2 Mei 2026 ada empat fakultas yang berganti nama. Fakultas Pertanian menjadi Fakultas Bio-Industri Pertanian
      dan Kehutanan, Fakultas Peternakan menjadi Fakultas Sains dan Teknologi Peternakan, FMIPA menjadi Fakultas Sains,
      Teknologi, dan Matematika, dan Fakultas Teknologi Pertanian menjadi Fakultas Teknologi Agroindustri dan Biosistem.
      Ijazah dengan nama lama tetap sah.
    sumber: [detik_rename]
    entitas: bebas
  - id: jumlah-mahasiswa
    q: Berapa jumlah mahasiswa UB?
    variasi: [mahasiswa UB ada berapa, berapa banyak mahasiswa di Brawijaya, jumlah mahasiswa baru UB, UB punya berapa mahasiswa]
    a: >-
      UB memiliki lebih dari 60.000 mahasiswa. Menurut data resmi per Juni 2025, dalam setahun ada 17.485 mahasiswa baru
      dan 11.431 lulusan.
    sumber: [ub_stat, ub_profil]
  - id: jumlah-prodi
    q: Berapa jumlah program studi di UB?
    variasi: [UB punya berapa prodi, ada berapa jurusan di UB, jumlah jurusan di Brawijaya, berapa program studi Universitas Brawijaya]
    a: Menurut data resmi per Juni 2025, UB memiliki 197 program studi.
    sumber: [ub_stat]
  - id: jumlah-guru-besar
    q: Berapa jumlah profesor di UB?
    variasi: [guru besar UB ada berapa, berapa profesor di Brawijaya, jumlah dosen doktor di UB, UB punya berapa guru besar]
    a: Menurut data resmi per Juni 2025, UB memiliki 271 guru besar dan 1.076 dosen bergelar doktor.
    sumber: [ub_stat]
  - id: status-ptnbh
    q: Apa status kelembagaan UB sekarang?
    variasi: [UB itu PTNBH bukan, status UB apa, sejak kapan UB jadi PTNBH, UB negeri atau swasta, apakah UB perguruan tinggi negeri badan hukum]
    a: UB adalah perguruan tinggi negeri berstatus PTNBH atau Perguruan Tinggi Negeri Badan Hukum berdasarkan Peraturan Pemerintah Nomor 108 Tahun 2021.
    sumber: [prasetya_ptnbh]
  - id: akreditasi-ub
    q: Apa akreditasi UB?
    variasi: [UB akreditasinya apa, akreditasi Universitas Brawijaya, apakah UB terakreditasi unggul, akreditasi institusi UB]
    a: UB terakreditasi Unggul dari BAN-PT berdasarkan SK tanggal 21 November 2023.
    sumber: [ub_akreditasi]
  - id: akreditasi-internasional
    q: Program studi UB mana yang terakreditasi internasional?
    variasi: [prodi UB yang akreditasi internasional, jurusan UB yang terakreditasi internasional, akreditasi internasional di UB]
    a: >-
      Beberapa program studi UB terakreditasi internasional, antara lain Akuntansi FEB oleh ACCA, magister Akuntansi,
      Ilmu Ekonomi, dan Manajemen FEB oleh ABEST21, Administrasi Bisnis FIA oleh IACBE dan AASBI, Teknik Elektro oleh IABEE,
      serta Ilmu dan Teknologi Pangan oleh IFT.
    sumber: [ub_akreditasi]
  - id: peringkat
    q: Berapa peringkat UB di dunia?
    variasi: [ranking UB di dunia, peringkat QS UB, UB peringkat berapa, ranking Brawijaya berapa, peringkat UB di Asia]
    a: >-
      Pada QS World University Rankings 2027, UB berada di peringkat 616 dunia, naik 64 peringkat dari tahun sebelumnya.
      Di QS Asia 2026, UB berada di peringkat 145 Asia.
    sumber: [prasetya_qs2027, topuni]
  - id: visi
    q: Apa visi UB?
    variasi: [visi Universitas Brawijaya, visi kampus Brawijaya, apa visi kampus UB]
    a: >-
      Visi UB adalah menjadi perguruan tinggi pelopor dan pembaharu dengan reputasi internasional dalam ilmu pengetahuan
      dan teknologi, terutama yang menunjang industri berbasis budaya untuk kesejahteraan masyarakat.
    sumber: [ub_visi]
  - id: misi
    q: Apa misi UB?
    variasi: [misi Universitas Brawijaya, sebutkan misi UB, misi kampus Brawijaya]
    a: >-
      Misi UB ada empat: menyelenggarakan pendidikan berstandar internasional; menyelenggarakan penelitian yang bermanfaat
      bagi masyarakat; menyelenggarakan pengabdian kepada masyarakat berdasarkan kearifan lokal; serta mengelola perguruan
      tinggi yang unggul, berkeadilan, dan berkelanjutan.
    sumber: [ub_visi]

  # ---------------------------------------------------------------- sejarah
  - id: penegerian
    q: Kapan UB resmi menjadi universitas negeri?
    variasi: [kapan UB jadi PTN, kapan UB didirikan, UB berdiri tahun berapa, kapan Universitas Brawijaya dinegerikan]
    a: >-
      Cikal bakal UB dibuka pada 1 Juli 1957, lalu UB resmi menjadi universitas negeri pada 5 Januari 1963 berdasarkan
      SK Menteri PTIP Nomor 1 Tahun 1963. Tanggal 5 Januari diperingati sebagai Dies Natalis UB.
    sumber: [ub_sejarah, fh_sejarah]
  - id: asal-nama
    q: Siapa yang memberikan nama Universitas Brawijaya dan dari mana asal nama Brawijaya?
    variasi: [kenapa namanya Brawijaya, arti nama Brawijaya, siapa yang memberi nama Universitas Brawijaya, asal usul nama UB, Brawijaya itu diambil dari mana]
    a: >-
      Nama Universitas Brawijaya diberikan oleh Presiden Soekarno melalui kawat tanggal 11 Juli 1961.
      Nama Brawijaya diambil dari gelar raja-raja Majapahit.
    sumber: [ub_sejarah, feb_sejarah]
  - id: nama-lama-ub
    q: Apa nama UB sebelum bernama Universitas Brawijaya?
    variasi: [dulu UB namanya apa, nama lama Universitas Brawijaya, sebelum jadi UB namanya apa, UB dulunya bernama apa]
    a: >-
      Sebelum bernama Universitas Brawijaya pada 1961, namanya Universitas Kotapraja Malang. Cikal bakalnya adalah
      Perguruan Tinggi Hukum dan Pengetahuan Masyarakat yang dibuka 1 Juli 1957.
    sumber: [ub_sejarah, fh_sejarah]
  - id: fakultas-awal
    q: Apa saja fakultas pertama UB?
    variasi: [fakultas tertua UB apa, fakultas awal Universitas Brawijaya, dulu UB punya fakultas apa saja, fakultas yang pertama ada di UB]
    a: >-
      Pada 1961 UB memiliki empat fakultas, yaitu Fakultas Hukum dan Pengetahuan Masyarakat, Fakultas Ekonomi,
      Fakultas Administrasi Niaga, dan Fakultas Pertanian. Fakultas Hukum adalah fakultas tertua di UB.
    sumber: [ub_sejarah, fh_sejarah]
  - id: dies-natalis
    q: Kapan Dies Natalis UB?
    variasi: [ulang tahun UB tanggal berapa, hari jadi Universitas Brawijaya, kapan ulang tahun Brawijaya, umur UB berapa tahun]
    a: >-
      Dies Natalis UB diperingati setiap 5 Januari. Pada 5 Januari 2026 UB berusia 63 tahun, dan Dies Natalis ke-64
      jatuh pada 5 Januari 2027.
    sumber: [ub_sejarah, kalender_akademik, malangtimes_dies63]

  # ---------------------------------------------------------------- pimpinan
  - id: rektor
    q: Siapa rektor UB sekarang?
    variasi: [rektor UB siapa, siapa rektor Universitas Brawijaya, nama rektor Brawijaya, siapa pemimpin UB, rektor Brawijaya sekarang siapa]
    a: Rektor Universitas Brawijaya periode 2022 sampai 2027 adalah Profesor Widodo. Sebelumnya beliau adalah Dekan Fakultas MIPA UB.
    sumber: [ub_pejabat, mwa_rektor]
  - id: wakil-rektor
    q: Siapa saja wakil rektor UB?
    variasi: [wakil rektor UB siapa saja, daftar wakil rektor Brawijaya, siapa wakil rektor bidang akademik, siapa warek UB, wakil rektor bidang kemahasiswaan siapa]
    a: >-
