    a: >-
      Kelompok UKT ditentukan dari data kemampuan ekonomi orang tua, bukan dipilih sendiri. Untuk jalur SNBP dan SNBT,
      UKT kelompok 1 sebesar 500 ribu rupiah dan kelompok 2 sebesar 1 juta rupiah per semester.
    sumber: [kompas_ukt2026]
  - id: ipi
