    a: >-
      IPI atau Iuran Pengembangan Institusi hanya berlaku untuk jalur mandiri dan dibayar sekali di awal kuliah.
      Besarnya untuk tahun 2026 diatur dalam Peraturan Rektor Nomor 123 Tahun 2025.
