# Knowledge Base BRONE v4.0 (sumber utama, satu-satunya file yang diedit manual)
# ---------------------------------------------------------------------------
# File turunan dibuat oleh build_kb.py:
#   - chunks.jsonl  : chunk kecil + breadcrumb + metadata sumber (untuk RAG versi baru)
#   - knowledge.txt : format lama (BAGIAN N / [ Fxx ] / FAQ di BAGIAN 19), cocok untuk RagLite2/3
#
# Aturan penulisan:
#   1. Setiap fakta wajib punya `sumber` (id di daftar `sumber:` paling bawah).
#   2. Fakta yang tidak bisa diverifikasi TIDAK dimasukkan. Jangan ada catatan
#      "koreksi"/nilai lama yang salah di dalam teks, karena model bisa ikut mengucapkannya.
#   3. Data yang cepat basi (jadwal, biaya, peringkat) wajib memakai `berlaku_hingga`
#      atau menyebut tahun di teksnya.
#   4. Teks ditulis dalam kalimat lengkap yang bisa langsung diucapkan robot.

meta:
  nama: Knowledge Base BRONE
  versi: "4.1"
  diperbarui: "2026-10-26"
  catatan_keputusan:
    - Robot memperkenalkan diri sebagai Bron. Nama anggota tim robot tidak dicantumkan.
    - Lantai laboratorium FILKOM tidak dicantumkan karena sumbernya tidak konsisten.
    - Jam buka perpustakaan tidak dicantumkan; robot mengarahkan ke lib.ub.ac.id.
    - Jumlah fakultas ditulis 17 fakultas ditambah Sekolah Pascasarjana (Peraturan Rektor 44/2026).
    - Sejarah fakultas yang belum terverifikasi (FK, FISIP, FIB, FKG, FIKES, FV, FSTeM, FTAB) belum dimasukkan.

# ===========================================================================
# BAGIAN UMUM (urutan = nomor BAGIAN di knowledge.txt; BAGIAN 19 khusus FAQ)
# ===========================================================================
bagian:
  - nomor: 1
    judul: PROFIL UMUM UNIVERSITAS BRAWIJAYA
    fakta:
      - sub: Identitas
        teks: >-
          Universitas Brawijaya, disingkat UB, adalah perguruan tinggi negeri di Kota Malang, Jawa Timur.
          Kampus utamanya berada di Jalan Veteran, Malang 65145. Moto UB adalah "Building Up Noble Future",
          yang berarti membangun kemuliaan masa depan.
        sumber: [ub_profil, ub_brand, ub_stat]
      - sub: Status kelembagaan
        teks: >-
          UB berstatus Perguruan Tinggi Negeri Badan Hukum atau PTNBH berdasarkan Peraturan Pemerintah Nomor 108
          Tahun 2021 tanggal 18 Oktober 2021. Sebelumnya UB berstatus PTN Badan Layanan Umum sejak 17 Desember 2008.
          Sebagai PTNBH, UB memiliki Majelis Wali Amanat, Rektor, Senat Akademik Universitas, dan Komite Audit.
        sumber: [prasetya_ptnbh, ub_visi]
      - sub: Akreditasi institusi
        teks: >-
          UB terakreditasi Unggul dari BAN-PT berdasarkan SK Nomor 957/SK/BAN-PT/Ak.Ppj/PT/XI/2023 tanggal 21 November 2023.
        sumber: [ub_akreditasi]
      - sub: UB dalam angka
        teks: >-
          Menurut data resmi UB per Juni 2025, UB memiliki 197 program studi, 271 guru besar, 1.076 dosen bergelar doktor,
          17.485 mahasiswa baru, dan 11.431 lulusan. Secara keseluruhan UB memiliki lebih dari 60.000 mahasiswa.
          UB pernah enam kali menjadi juara umum PIMNAS.
        sumber: [ub_stat, ub_profil]
      - sub: Jumlah fakultas
        teks: >-
          UB memiliki 17 fakultas ditambah Sekolah Pascasarjana. Data statistik resmi UB menghitungnya sebagai 18 fakultas
          karena Sekolah Pascasarjana ikut dihitung.
        sumber: [detik_rename, ub_stat]
      - sub: Lokasi kampus
        teks: >-
          Kampus utama UB berada di Jalan Veteran, Kota Malang, dengan luas sekitar 51,6 hektare dan ketinggian sekitar 492 meter
          di atas permukaan laut. UB juga memiliki Kampus Dieng di Jalan Puncak Dieng, Kalisongo, Kecamatan Dau, Kabupaten Malang,
          yang menjadi lokasi Fakultas Kedokteran Hewan dan Fakultas Ilmu Kesehatan. Ada pula PSDKU di Kediri dan
          program pascasarjana di Jakarta. Kampus baru UB sedang dibangun di Desa Panggungrejo, Kepanjen, Kabupaten Malang,
          di atas lahan sekitar 30 hektare. Gedung Fakultas Vokasi sedang dibangun di kampus Kepanjen tersebut.
        sumber: [ub_stat, fkh_kontak, fikes_home, selma_ukt, aset_kepanjen]
      - sub: Luas aset
        teks: >-
          Total aset lahan UB sekitar 981 hektare. Hanya sekitar 20 persen yang dipakai langsung untuk perkuliahan;
          sisanya berupa lahan penelitian, hutan pendidikan UB Forest, laboratorium riset, dan teaching factory.
        sumber: [web_aset981]
      - sub: Kontak resmi UB
        teks: >-
          Telepon UB 0341-551611. Website utama www.ub.ac.id. Informasi pendaftaran mahasiswa baru ada di selma.ub.ac.id,
          dan layanan akademik di akademik.ub.ac.id. Berita resmi UB ada di prasetya.ub.ac.id.
        sumber: [ub_pejabat, ub_admisi]

  - nomor: 2
    judul: SEJARAH UNIVERSITAS BRAWIJAYA
    fakta:
      - sub: Awal berdiri
        teks: >-
          Cikal bakal UB adalah Perguruan Tinggi Hukum dan Pengetahuan Masyarakat atau PTHPM yang dibuka pada 1 Juli 1957
          oleh Yayasan Perguruan Tinggi Malang. Pada 1 Juli 1960 namanya menjadi Universitas Kotapraja Malang.
        sumber: [ub_sejarah, fh_sejarah]
      - sub: Asal nama Brawijaya
        teks: >-
          Nama Universitas Brawijaya diberikan oleh Presiden Soekarno melalui kawat Nomor 258/K/1961 tanggal 11 Juli 1961.
          Nama Brawijaya diambil dari gelar raja-raja Kerajaan Majapahit.
        sumber: [ub_sejarah, ub_profil, feb_sejarah]
      - sub: Penegerian dan Dies Natalis
        teks: >-
          UB resmi menjadi universitas negeri pada 5 Januari 1963 berdasarkan SK Menteri PTIP Nomor 1 Tahun 1963,
          yang dikukuhkan Keputusan Presiden Nomor 196 Tahun 1963 tanggal 23 September 1963.
          Tanggal 5 Januari diperingati sebagai Dies Natalis UB. Pada 5 Januari 2026 UB berusia 63 tahun,
          dan Dies Natalis ke-64 jatuh pada 5 Januari 2027.
        sumber: [ub_sejarah, kalender_akademik, malangtimes_dies63]
      - sub: Fakultas awal
        teks: >-
          Pada 1961 UB memiliki empat fakultas, yaitu Fakultas Hukum dan Pengetahuan Masyarakat, Fakultas Ekonomi,
          Fakultas Administrasi Niaga, dan Fakultas Pertanian. Fakultas Kedokteran Hewan dan Peternakan didirikan pada 26 Oktober 1961.
        sumber: [ub_sejarah]

  - nomor: 3
    judul: VISI DAN MISI UNIVERSITAS BRAWIJAYA
    fakta:
      - sub: Visi
        teks: >-
          Visi UB adalah menjadi perguruan tinggi pelopor dan pembaharu dengan reputasi internasional dalam ilmu pengetahuan
          dan teknologi, terutama yang menunjang industri berbasis budaya untuk kesejahteraan masyarakat.
        sumber: [ub_visi]
      - sub: Misi
        teks: >-
          Misi UB ada empat: menyelenggarakan pendidikan berstandar internasional; menyelenggarakan penelitian yang bermanfaat
          bagi masyarakat; menyelenggarakan pengabdian kepada masyarakat sebagai agen pembaruan dan pembangunan ekonomi bangsa
          berdasarkan kearifan lokal; serta mengelola perguruan tinggi yang unggul, berkeadilan, dan berkelanjutan.
          Visi dan misi ini tercantum dalam Renstra UB 2022 sampai 2027.
        sumber: [ub_visi]

  - nomor: 4
    judul: PIMPINAN UNIVERSITAS BRAWIJAYA
    fakta:
      - sub: Rektor
        teks: >-
          Rektor UB periode 2022 sampai 2027 adalah Profesor Widodo, S.Si., M.Si., Ph.D.Med.Sc. Beliau sebelumnya adalah
          Dekan Fakultas MIPA UB. Kantor rektor berada di Gedung Rektorat UB lantai 7.
        sumber: [ub_pejabat, mwa_rektor]
      - sub: Wakil Rektor
        teks: >-
          Wakil Rektor Bidang Akademik adalah Profesor Doktor Insinyur Imam Santoso, M.P.
          Wakil Rektor Bidang Keuangan dan Sumber Daya adalah Profesor Doktor Muchamad Ali Safaat, S.H., M.H.
          Wakil Rektor Bidang Kemahasiswaan, Alumni, dan Kewirausahaan Mahasiswa adalah Doktor Setiawan Noerdajasakti, S.H., M.H.
          Wakil Rektor Bidang Perencanaan, Kerja Sama, dan Internasionalisasi adalah Profesor Andi Kurniawan, S.Pi., M.Eng., D.Sc.
          Wakil Rektor Bidang Riset dan Inovasi adalah Profesor Doktor Unti Ludigdo, S.E., M.Si., Ak.
        sumber: [ub_pejabat]
      - sub: Sekretaris Universitas
        teks: >-
          Sekretaris Universitas Brawijaya adalah Doktor Tri Wahyu Nugroho, S.P., M.Si.
        sumber: [ub_pejabat]

  - nomor: 5
    judul: PERINGKAT DAN AKREDITASI INTERNASIONAL
    fakta:
      - sub: QS World University Rankings 2027
        teks: >-
          Pada QS World University Rankings 2027 yang terbit Juni 2026, UB berada di peringkat 616 dunia, naik 64 peringkat
          dari posisi 680 pada edisi 2026. UB berada di sekitar peringkat delapan nasional, dan kenaikannya tertinggi di antara PTNBH.
        sumber: [prasetya_qs2027, topuni]
      - sub: Peringkat lain
        teks: >-
          Pada QS Asia University Rankings 2026 UB berada di peringkat 145 Asia, naik dari peringkat 172 pada edisi 2025.
          Pada QS Sustainability Rankings UB berada di peringkat 623 dunia. Pada THE Asia University Rankings 2026 UB berada
          di kelompok 601 sampai 800.
        sumber: [topuni, prasetya_theasia]
      - sub: Akreditasi internasional program studi
        teks: >-
          Beberapa program studi UB terakreditasi internasional. ACCA untuk Akuntansi FEB, ABEST21 untuk magister Akuntansi,
          Ilmu Ekonomi, dan Manajemen FEB, IACBE dan AASBI untuk Administrasi Bisnis FIA, IABEE untuk Teknik Elektro FT,
          dan IFT untuk Ilmu dan Teknologi Pangan. UB menjadi anggota AUN-QA sejak 2014 dan memegang sertifikasi ISO 9001 sejak 2011.
        sumber: [ub_akreditasi]

  - nomor: 6
    judul: JALUR PENERIMAAN MAHASISWA BARU
    fakta:
      - sub: Jalur program sarjana
        teks: >-
          Jalur masuk program sarjana UB ada tiga: SNBP yang berbasis prestasi tanpa ujian tulis, SNBT yang berbasis tes UTBK,
          dan Seleksi Mandiri UB. Informasi SNBP dan SNBT ada di snpmb.bppp.kemdikbud.go.id, sedangkan seleksi mandiri di selma.ub.ac.id.
        sumber: [ub_admisi]
      - sub: Seleksi Mandiri 2026
        teks: >-
          Pada 2026 Seleksi Mandiri UB memiliki empat jalur: Jalur Prestasi, Jalur Nilai Rapor, Jalur Nilai UTBK,
          dan Seleksi Mandiri Penyandang Disabilitas. Pendaftaran dilakukan melalui admisi.ub.ac.id.
          Jadwal penerimaan mahasiswa baru 2027 belum diumumkan.
        sumber: [detik_ukt2026]
        berlaku_hingga: "2027-06-30"
      - sub: Program diploma, disabilitas, dan pascasarjana
        teks: >-
          Program diploma dan sarjana terapan di Fakultas Vokasi diterima melalui Seleksi Masuk Program Vokasi. UB juga membuka jalur
          khusus penyandang disabilitas bersama Pusat Studi dan Layanan Disabilitas UB. Seleksi program magister dan doktor
          dibuka dua kali setahun, untuk semester ganjil dan genap, melalui selma.ub.ac.id.
        sumber: [ub_admisi]
      - sub: Kontak layanan akademik
        teks: >-
          Direktorat Administrasi dan Layanan Akademik atau DALA UB berada di Gedung Rektorat lantai 2. Teleponnya 0341-551611
          ekstensi 117 dan 118, atau langsung 0341-575754. Emailnya akademik.center@ub.ac.id.
        sumber: [ub_admisi]

  - nomor: 7
    judul: BIAYA KULIAH UKT DAN IPI
    fakta:
      - sub: Aturan biaya mahasiswa baru 2026
        teks: >-
          Biaya mahasiswa baru UB tahun 2026 diatur oleh Peraturan Rektor UB Nomor 118 Tahun 2025 untuk Uang Kuliah Tunggal
          atau UKT, dan Peraturan Rektor Nomor 123 Tahun 2025 untuk Iuran Pengembangan Institusi atau IPI.
          UKT dibayar setiap semester. IPI hanya berlaku untuk jalur mandiri dan dibayar sekali di awal kuliah.
        sumber: [selma_ukt, selma_ipi, detik_ukt2026]
        berlaku_hingga: "2027-06-30"
      - sub: UKT jalur SNBP dan SNBT
        teks: >-
          Untuk jalur SNBP dan SNBT, UKT kelompok 1 sebesar 500 ribu rupiah dan kelompok 2 sebesar 1 juta rupiah per semester
          untuk semua program studi. Kelompok yang lebih tinggi besarnya berbeda tiap program studi. Kelompok UKT ditentukan
          dari data kemampuan ekonomi orang tua, bukan dipilih sendiri.
        sumber: [kompas_ukt2026]
      - sub: Contoh biaya jalur mandiri
        teks: >-
          Pada jalur mandiri 2026, UKT tertinggi ada di Kedokteran, yaitu 19,16 juta sampai 24 juta rupiah per semester,
          dengan IPI 150 juta sampai 225 juta rupiah. Kedokteran Gigi memiliki IPI 100 juta sampai 150 juta rupiah.
          Rincian per program studi ada di bagian tiap fakultas dan di selma.ub.ac.id.
        sumber: [detik_ukt2026, selma_ipi]
        berlaku_hingga: "2027-06-30"

  - nomor: 8
    judul: KALENDER AKADEMIK SEMESTER DAN WISUDA
    fakta:
      - sub: Semester ganjil 2026/2027
        teks: >-
          Perkuliahan semester ganjil tahun akademik 2026/2027, termasuk UTS dan UAS, berlangsung 18 Agustus sampai 18 Desember 2026.
          Batas akhir pengumuman nilai adalah 2 Januari 2027, dan semester ganjil berakhir 8 Januari 2027.
        sumber: [kalender_akademik]
        berlaku_hingga: "2027-01-08"
      - sub: Semester genap 2026/2027
        teks: >-
          Registrasi semester genap dilakukan 18 sampai 29 Januari 2027, pengisian KRS 20 sampai 30 Januari 2027,
          dan perkuliahan semester genap berlangsung 8 Februari sampai 18 Juni 2027. Semester Antara berlangsung
          21 Juni sampai 16 Juli 2027, dan semester genap berakhir 30 Juli 2027.
        sumber: [kalender_akademik]
        berlaku_hingga: "2027-07-30"
      - sub: Dies Natalis 2027
        teks: >-
          Upacara Dies Natalis UB ke-64 dengan pidato ilmiah dijadwalkan pada 5 Januari 2027.
        sumber: [kalender_akademik]
        berlaku_hingga: "2027-01-05"
      - sub: Wisuda 2026/2027
        teks: >-
          Wisuda UB tahun akademik 2026/2027 digelar di Gedung Samantha Krida. Periode I sampai VI sudah berlangsung
          pada September dan Oktober 2026. Periode VII digelar Sabtu 14 November 2026 dan periode VIII Minggu
          15 November 2026, pukul 07.30 sampai 11.30. Pendaftaran wisuda dilakukan melalui bagian akademik
          fakultas masing-masing.
        sumber: [ub_wisuda56, ub_wisuda78]
        berlaku_hingga: "2026-11-15"

      - sub: Ketentuan wisuda
        teks: >-
          Setiap wisudawan boleh membawa paling banyak dua pendamping. Undangan elektronik berbentuk QR code diunduh dari SIAM,
          dan pendamping masuk Gedung Samantha Krida melalui Pintu A atau Pintu D. Toga wajib dipakai sesuai Peraturan Rektor Nomor 59 Tahun 2026 dan bisa dipesan melalui KPRI UB,
          dengan warna kerah sesuai identitas fakultas.
        sumber: [ub_wisuda56]

  - nomor: 10
    judul: FASILITAS KAMPUS UB
    fakta:
      - sub: Fasilitas umum
        teks: >-
          Fasilitas umum UB antara lain kantor cabang Bank BCA, Mandiri, BNI, BRI, dan BTN, ATM, Guest House UB,
          penginapan Griya Brawijaya, Kantor Pos, Toserba KPRI UB, Daycare Center UB, dan Masjid Raden Patah.
        sumber: [ub_fasum]
      - sub: Gedung dan olahraga
        teks: >-
          UB memiliki Gedung Samantha Krida dan Widyaloka sebagai gedung pertemuan besar, serta Pertamina Sport Arena,
          Sport Clubhouse, dan lapangan sepak bola di Kampus Dieng. UB Sport Center menyediakan fitnes, aerobik,
          tenis lapangan, bulu tangkis, tenis meja, dan futsal.
        sumber: [ub_profil, filkom_fasilitas]
      - sub: Fasilitas kesehatan
        teks: >-
          Fasilitas kesehatan UB terdiri atas Poliklinik UB, Rumah Sakit Universitas Brawijaya atau RSUB, Rumah Sakit Gigi
          dan Mulut UB, dan Rumah Sakit Hewan Pendidikan UB. RSUB terakreditasi KARS Bintang Lima atau Paripurna.
          Klinik UB melayani poli umum, poli gigi, poli gizi, dan poli kesehatan ibu dan anak.
        sumber: [ub_kesehatan, ub_prestasi, filkom_fasilitas]
      - sub: Perpustakaan
        teks: >-
          Perpustakaan pusat UB terakreditasi A dari Perpustakaan Nasional dan menjadi anggota IATUL sejak 2016.
          Mahasiswa dapat meminjam hingga 25 buku koleksi umum selama 14 hari. Informasi layanan dan jam buka ada di lib.ub.ac.id.
        sumber: [ub_akreditasi, ub_lib]
      - sub: Layanan disabilitas
        teks: >-
          Pusat Studi dan Layanan Disabilitas UB atau PSLD didirikan pada 19 Maret 2012 untuk penelitian isu disabilitas
          dan layanan bagi mahasiswa penyandang disabilitas.
        sumber: [filkom_fasilitas]

  - nomor: 11
    judul: PRESTASI DAN DANA ABADI
    fakta:
      - sub: PIMNAS
        teks: >-
          UB enam kali menjadi juara umum PIMNAS, termasuk tiga kali berturut-turut pada 2015, 2016, dan 2017.
        sumber: [ub_stat, ub_prestasi]
      - sub: Dana Abadi UB
        teks: >-
          Dana Abadi UB terkumpul sekitar 76 miliar rupiah pada 2025. Beasiswa Dana Abadi pertama disalurkan pada 12 Agustus 2025
          kepada 50 mahasiswa dari keluarga kurang mampu, berupa subsidi UKT 3,5 juta rupiah per semester hingga semester delapan.
        sumber: [prasetya_danaabadi]

  - nomor: 12
    judul: BEASISWA
    fakta:
      - sub: Beasiswa mahasiswa
        teks: >-
          UB menyediakan beasiswa dari pemerintah, perusahaan, dan dana abadi UB, untuk mahasiswa berprestasi maupun yang kurang mampu.
          Informasi lengkap ada di beasiswa.ub.ac.id.
        sumber: [ub_beasiswa, prasetya_danaabadi]
      - sub: BISS
        teks: >-
          Brawijaya International Student Scholarship atau BISS adalah beasiswa penuh untuk mahasiswa asing. Pada 2025 BISS menerima
          sekitar 2.349 pendaftar, naik jauh dari sekitar 400 pendaftar pada 2024.
        sumber: [kanal24_biss]

  - nomor: 13
    judul: UNIT KEGIATAN MAHASISWA
    fakta:
      - sub: UKM penalaran dan kesenian
        teks: >-
          UKM bidang penalaran di UB antara lain Formasi, Fordi Mapelar, UAPKM atau pers mahasiswa, IAAS, AIESEC, R-KIM, dan Mahasiswa Wirausaha.
          UKM kesenian antara lain Unit Aktivitas Band, Paduan Suara Mahasiswa, UNITANTRI untuk karawitan dan tari, Teater Kutub,
          Marching Band, Sinematografi Nol Derajat, dan Seni Religi.
        sumber: [ub_ukm]
      - sub: UKM olahraga
        teks: >-
          UKM olahraga UB antara lain bulu tangkis, bola basket, bola voli, sepak bola, tenis lapangan, tenis meja, renang, softball dan baseball,
          boomerang, panahan, bridge, Basic Shooting Club, Brawijaya Chess Club, Perisai Diri, PSHT, Tapak Suci, Merpati Putih,
          Shorinji Kempo, Taekwondo, dan INKAI.
        sumber: [ub_ukm]
      - sub: UKM minat khusus dan kerohanian
        teks: >-
          UKM minat khusus antara lain Resimen Mahasiswa, KSR, Impala atau pecinta alam, Pramuka, dan Tegasz. UKM kerohanian terdiri atas
          UAKI untuk Islam, UAKK untuk Kristen, UAKKat untuk Katolik, UAKB untuk Buddha, dan UNIKAHIDA untuk Hindu.
        sumber: [ub_ukm]

  - nomor: 14
    judul: TENTANG BRONE ROBOT MASKOT UB
    fakta:
      - sub: Maskot BRONE
        teks: >-
          BRONE adalah maskot resmi Universitas Brawijaya. BRONE merupakan singkatan dari Brawijaya Number One.
          Konsepnya adalah robot pendamping yang menjadi pemandu informasi, mampu belajar, dan terus berkembang.
          Bentuk robot melambangkan inovasi serta kekuatan daya saing. Warna biru, kuning, silver, dan hitam melambangkan
          kepercayaan, kebahagiaan, modernisasi, dan elegan.
        sumber: [ub_brand]
      - sub: Robot Bron
        teks: >-
          Saya adalah Bron, robot humanoid yang mewujudkan maskot BRONE Universitas Brawijaya. Saya dikembangkan melalui program
          UB Globalizing Project Robot BRONE oleh dosen, mahasiswa, dan alumni dari Fakultas Ilmu Komputer, Teknik Elektro,
          dan Teknik Mesin UB.
        sumber: [filkom_pitoyo2026, filkom_workshop2024]
      - sub: Kemampuan Bron
        teks: >-
          Bron bisa mendengar pertanyaan dan menjawab informasi seputar Universitas Brawijaya dengan suara dalam bahasa Indonesia,
          menampilkan ekspresi wajah, dan menatap atau mengikuti wajah lawan bicara. Bron belum bisa melakukan gerakan fisik seperti
          melambai, duduk, berdiri, atau berjalan mengikuti orang.
        sumber: [tim_brone]
      - sub: Prestasi dan kerja sama
        teks: >-
          Tim BRONE dari FILKOM UB meraih Juara 3 Best Performance Team pada National Industrial Robotic Competition atau NIRC 2025
          di Universitas Negeri Padang, 17 sampai 21 Februari 2025, bersaing dengan 34 tim dari 20 perguruan tinggi.
          Pada 30 Agustus 2024 UB dan Chukyo University dari Jepang mengadakan workshop pengembangan teknologi robot untuk tim robot BRONE
          di Gedung F FILKOM, dengan narasumber Profesor Pitoyo Hartono.
        sumber: [filkom_nirc2025, filkom_workshop2024]
      - sub: BRONE sebagai LMS
        teks: >-
          Selain nama maskot dan robot, BRONE juga nama LMS atau Learning Management System, yaitu platform pembelajaran daring di brone.ub.ac.id
          yang dipakai FILKOM dan Fakultas Kedokteran untuk perkuliahan.
        sumber: [filkom_fasilitas]

  - nomor: 15
    judul: KONTAK PENTING DAN LAYANAN
    fakta:
      - sub: Kontak layanan
        teks: >-
          Telepon umum UB 0341-551611. Layanan akademik DALA di Gedung Rektorat lantai 2, telepon 0341-575754.
