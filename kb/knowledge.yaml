    a: >-
      Ya. UB membuka jalur khusus penyandang disabilitas bersama Pusat Studi dan Layanan Disabilitas UB atau PSLD,
      yang didirikan pada 19 Maret 2012 untuk melayani mahasiswa penyandang disabilitas.
