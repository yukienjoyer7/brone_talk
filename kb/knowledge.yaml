        teks: >-
          FILKOM memiliki beberapa gedung, antara lain Gedung A, Gedung F, dan Gedung G. Gedung F adalah gedung tertinggi di UB.
          Smart Class ada di lantai 2, 3, dan 4 Gedung F. Helpdesk dan operator akademik ada di lantai 1 Gedung F.
          Auditorium Algoritma ada di lantai 2 Gedung G, dan Mini Teater Heuristik ada di lantai 2 Gedung A.
          Ruang Baca ada di koridor lantai 2 antara Gedung F dan Gedung G.
        sumber: [filkom_fasilitas]
      - sub: Fasilitas mahasiswa FILKOM
        teks: >-
          Gedung Kreativitas Mahasiswa FILKOM memiliki lima lantai. Lantai 1 untuk co-working space, lantai 2 dan 3 untuk ruang himpunan
          mahasiswa, lantai 4 untuk aula, dan lantai 5 berupa helipad untuk riset drone. Mushola Ulul Al-Baab berada di sebelah
          Gedung Kreativitas Mahasiswa. Unit Konseling ada di Gedung A. Ada juga Game Corner, gazebo, dan ruang laktasi.
          Griya Brawijaya, tempat menginap bagi tamu dan orang tua mahasiswa, berada di seberang Gedung G.
        sumber: [filkom_fasilitas]
      - sub: Laboratorium FILKOM
        teks: >-
