    entitas: F14
  - id: konseling-filkom
    q: Di mana unit konseling FILKOM?
    variasi: [layanan konseling FILKOM, konseling mahasiswa FILKOM di mana, tempat konseling di FILKOM]
    a: Unit Konseling FILKOM ada di Gedung A.
    sumber: [filkom_fasilitas]
    entitas: F14
  - id: aksesibilitas-filkom
    q: Apakah gedung FILKOM ramah disabilitas?
    variasi: [fasilitas disabilitas di FILKOM, lift di FILKOM ada tidak, parkir disabilitas FILKOM]
    a: >-
      Ya. Gedung-gedung FILKOM dilengkapi ramp, lift yang ramah tunanetra, toilet khusus disabilitas di setiap gedung,
      dan parkir khusus penyandang disabilitas di basemen Gedung F dan G.
    sumber: [filkom_fasilitas]
    entitas: F14
  - id: skripsi-filkom
    q: Bagaimana mengurus skripsi di FILKOM?
    variasi: [FILKOM Apps untuk apa, daftar seminar skripsi FILKOM, aplikasi skripsi FILKOM]
    a: Skripsi di FILKOM dikelola lewat FILKOM Apps, mulai dari proposal, logbook, seminar hasil, hingga ujian.
    sumber: [filkom_fasilitas]
    entitas: F14
  - id: instagram-filkom
    q: Apa Instagram resmi FILKOM?
    variasi: [akun Instagram FILKOM, media sosial FILKOM, IG FILKOM apa]
    a: Instagram resmi FILKOM adalah filkomub.
    sumber: [filkom_fasilitas]
    entitas: F14
  - id: sosialisasi-ortu-filkom
    q: Kapan sosialisasi orang tua mahasiswa baru FILKOM?
    variasi: [acara FILKOM terdekat, sosialisasi akademik orang tua FILKOM 2026, pertemuan orang tua mahasiswa baru FILKOM]
    a: >-
      Sosialisasi Akademik Orang Tua Mahasiswa Baru FILKOM angkatan 2026 diadakan pada 31 Oktober 2026 pukul 08.00
      di Auditorium Algoritma Gedung G lantai 2.
    sumber: [filkom_home]
    berlaku_hingga: "2026-10-31"
    entitas: F14

