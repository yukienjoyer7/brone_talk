[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brone-talk"
version = "0.2.0"
description = "BRONE Talk: pipeline percakapan suara robot (wake word, STT, jawaban FAQ/RAG/LLM, TTS, MQTT)"
readme = "README.md"
requires-python = ">=3.12"
# Versi dikunci sama dengan requirements-nuc.txt versi produksi (lihat docs/baseline-config.md).
dependencies = [
  "faster-whisper==1.2.1",
  "numpy==1.26.4",
  "onnxruntime==1.19.2",
  "paho-mqtt==2.1.0",
  "piper-tts>=1.2,<2",
  "scipy==1.15.3",
  "sounddevice==0.5.3",
  "websockets==17.1",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]
# wake word "halo brone". openwakeword sendiri dipasang --no-deps (deploy/install.sh): ia menuntut
# tflite-runtime di Linux yang tidak punya wheel py3.12; BRONE memakai model ONNX saja.
kws = ["scikit-learn", "tqdm", "requests"]

[project.scripts]
brone-talk = "brone_talk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C90"]
ignore = ["B905"]  # zip() tanpa strict=: panjang input memang sama di semua pemanggil

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# teks prompt, regex, dan keluaran CLI lebih mudah dibaca utuh dalam satu baris
"src/brone_talk/engine/llm.py" = ["E501"]
"src/brone_talk/tts/normalize.py" = ["E501"]
"src/brone_talk/cli.py" = ["E501"]
"tests/*" = ["E501"]
